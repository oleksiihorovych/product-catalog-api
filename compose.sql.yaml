# Run this override on an x64 Linux Docker host; no architecture emulation is configured.
services:
  api:
    environment:
      Storage__Mode: SqlServer
      ConnectionStrings__Catalog: "Server=sqlserver;Database=ProductCatalog;User ID=catalog_http;Password=${CATALOG_HTTP_PASSWORD:?Set CATALOG_HTTP_PASSWORD};Encrypt=true;TrustServerCertificate=true;Max Pool Size=32;ConnectRetryCount=0"
    depends_on:
      provision-reader:
        condition: service_completed_successfully

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SQL_ADMIN_PASSWORD:?Set SQL_ADMIN_PASSWORD}"
    volumes:
      - catalog-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  migrate:
    build: .
    image: product-catalog-api:local
    command: ["--migrate", "--seed"]
    healthcheck:
      disable: true
    environment:
      Storage__Mode: SqlServer
      ConnectionStrings__Catalog: "Server=sqlserver;Database=ProductCatalog;User ID=sa;Password=${SQL_ADMIN_PASSWORD:?Set SQL_ADMIN_PASSWORD};Encrypt=true;TrustServerCertificate=true;ConnectRetryCount=0"
    depends_on:
      sqlserver:
        condition: service_healthy

  provision-reader:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    entrypoint: ["/bin/bash", "/setup/setup-reader.sh"]
    environment:
      SQLCMDPASSWORD: "${SQL_ADMIN_PASSWORD:?Set SQL_ADMIN_PASSWORD}"
      CATALOG_HTTP_PASSWORD: "${CATALOG_HTTP_PASSWORD:?Set CATALOG_HTTP_PASSWORD}"
    volumes:
      - ./scripts/setup-reader.sh:/setup/setup-reader.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  catalog-sql:
