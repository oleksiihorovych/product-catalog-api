name: Catalog CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"

jobs:
  checks:
    name: Build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate workflow syntax
        env:
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/ci.yaml
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      - name: Check migration matches the model
        env:
          Storage__Mode: SqlServer
          ConnectionStrings__Catalog: Server=localhost;Database=ModelValidation;Integrated Security=true
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/ProductCatalog.Infrastructure --startup-project src/ProductCatalog.Api --configuration Release --no-build

  sql:
    name: SQL Server integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Start isolated x64 SQL Server
        run: |
          sql_password="Ci1_$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$sql_password"
          printf 'CATALOG_TEST_SQL=Server=localhost,1433;Database=master;User ID=sa;Password=%s;Encrypt=true;TrustServerCertificate=true;ConnectRetryCount=0\n' "$sql_password" >> "$GITHUB_ENV"
          docker run --detach --name catalog-test-sql --memory=2g -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$sql_password" \
            mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
          for attempt in $(seq 1 60); do
            if docker exec -e "SQLCMDPASSWORD=$sql_password" catalog-test-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'SQL Server did not become ready' >&2
          exit 1
      - run: dotnet restore tests/ProductCatalog.SqlServer.Tests/ProductCatalog.SqlServer.Tests.csproj --locked-mode
      - run: dotnet build tests/ProductCatalog.SqlServer.Tests/ProductCatalog.SqlServer.Tests.csproj --no-restore --configuration Release
      - run: dotnet test tests/ProductCatalog.SqlServer.Tests/ProductCatalog.SqlServer.Tests.csproj --no-build --configuration Release
      - name: Remove isolated SQL Server
        if: always()
        run: docker rm --force catalog-test-sql || true

  container:
    name: Container and SQL Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare ephemeral development credentials
        run: |
          admin_password="Ci1_$(openssl rand -hex 24)"
          reader_password="Read1_$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$admin_password"
          printf '::add-mask::%s\n' "$reader_password"
          printf 'SQL_ADMIN_PASSWORD=%s\nCATALOG_HTTP_PASSWORD=%s\n' "$admin_password" "$reader_password" >> "$GITHUB_ENV"
      - run: docker build --tag product-catalog-api:local .
      - name: Start SQL Compose with explicit migration and read-only HTTP login
        run: docker compose -f compose.yaml -f compose.sql.yaml up --detach --wait --wait-timeout 180 --no-build
      - run: python3 scripts/smoke-api.py
      - name: Confirm read-only SQL permissions
        run: |
          docker compose -f compose.yaml -f compose.sql.yaml exec -T -e "SQLCMDPASSWORD=$SQL_ADMIN_PASSWORD" sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q \
            "EXECUTE AS LOGIN = N'catalog_http'; USE ProductCatalog; IF COALESCE(HAS_PERMS_BY_NAME('dbo.Products','OBJECT','SELECT'),0) <> 1 OR COALESCE(HAS_PERMS_BY_NAME('dbo.Products','OBJECT','INSERT'),0) <> 0 OR COALESCE(HAS_PERMS_BY_NAME('dbo.Products','OBJECT','ALTER'),0) <> 0 THROW 50000, 'Unexpected runtime permissions', 1;"
      - name: Save the tested image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output "$RUNNER_TEMP/product-catalog-api.tar" product-catalog-api:local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: "catalog-image-${{ github.sha }}"
          path: "${{ runner.temp }}/product-catalog-api.tar"
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
      - name: Clean up this runner's disposable Compose resources
        if: always()
        run: docker compose -f compose.yaml -f compose.sql.yaml down --volumes --remove-orphans

  publish:
    name: Publish validated image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, sql, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: "catalog-image-${{ github.sha }}"
          path: "${{ runner.temp }}"
      - name: Publish the tested image without rebuilding
        env:
          REGISTRY_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker load --input "$RUNNER_TEMP/product-catalog-api.tar"
          docker tag product-catalog-api:local "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$GITHUB_SHA")
          test -n "$reference"
          printf 'Image: `%s`\n\nRegistry artifact only; no hosted deployment has run.\n' "$reference" >> "$GITHUB_STEP_SUMMARY"
