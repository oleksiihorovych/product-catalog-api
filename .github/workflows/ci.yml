name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  verify:
    name: Build, unit tests and Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK and NuGet cache
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/**/packages.lock.json
            tests/**/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore ProductCatalog.slnx --locked-mode

      - name: Build Release
        run: dotnet build ProductCatalog.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test tests/ProductCatalog.UnitTests/ProductCatalog.UnitTests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory artifacts/test-results

      - name: Upload unit test results
        if: "${{ !cancelled() }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Docker image
        run: docker build --platform linux/amd64 --tag product-catalog-api:ci .
