name: product-catalog

# The fixed password is intentional for this local demo.
# Production deployments requires supply secrets outside this file.

x-application: &application
  image: product-catalog-api:local
  build:
    context: .
  environment: &application-environment
    Storage__Mode: SqlServer
    ConnectionStrings__Catalog: 'Server=db,1433;Database=ProductCatalog;User Id=sa;Password="CatalogDemo2026!";Encrypt=True;TrustServerCertificate=True'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: CatalogDemo2026!
    volumes:
      - catalog-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    <<: *application
    command: ["--migrate", "--seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *application
    environment:
      <<: *application-environment
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  catalog-data:
